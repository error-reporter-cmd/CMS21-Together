name: Build Dev Branch

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: Dev
    
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1
    
    - name: Restore NuGet packages
      run: nuget restore CMS21-Together.sln
    
    - name: Build solution
      run: msbuild CMS21-Together.sln /p:Configuration=Release /p:Platform="Any CPU"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: build-artifacts
        path: |
          CMS21-Together-Client/bin/Release/
          CMS21-Together-Core/bin/Release/
          CMS21-Together-Server/bin/Release/
        retention-days: 30
